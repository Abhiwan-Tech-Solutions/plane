services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: "http://localhost:8000"
        VITE_WEB_BASE_URL: "http://localhost:3000"
        VITE_ADMIN_BASE_URL: "http://localhost:3001"
        VITE_ADMIN_BASE_PATH: "/god-mode"
        VITE_SPACE_BASE_URL: "http://localhost:3002"
        VITE_SPACE_BASE_PATH: "/spaces"
        VITE_LIVE_BASE_URL: "http://localhost:3100"
        VITE_LIVE_BASE_PATH: "/live"
    restart: always
    depends_on:
      - api
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: "http://localhost:8000"
        VITE_WEB_BASE_URL: "http://localhost:3000"
        VITE_ADMIN_BASE_URL: "http://localhost:3001"
        VITE_ADMIN_BASE_PATH: "/god-mode"
        VITE_SPACE_BASE_URL: "http://localhost:3002"
        VITE_SPACE_BASE_PATH: "/spaces"
        VITE_LIVE_BASE_URL: "http://localhost:3100"
        VITE_LIVE_BASE_PATH: "/live"
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "3001:3000"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 96M

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: "http://localhost:8000"
        VITE_WEB_BASE_URL: "http://localhost:3000"
        VITE_ADMIN_BASE_URL: "http://localhost:3001"
        VITE_ADMIN_BASE_PATH: "/god-mode"
        VITE_SPACE_BASE_URL: "http://localhost:3002"
        VITE_SPACE_BASE_PATH: "/spaces"
        VITE_LIVE_BASE_URL: "http://localhost:3100"
        VITE_LIVE_BASE_PATH: "/live"
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "3002:3000"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 96M

  api:
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    environment:
      GUNICORN_WORKERS: "1"
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 512M

  worker:
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py wait_for_migrations &&
             celery -A plane worker --beat -l info -c 1 -P solo"
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 256M

  migrator:
    container_name: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: no
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

  live:
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - plane-redis
    environment:
      PORT: "3000"
      API_BASE_URL: "http://api:8000"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002"
      LIVE_BASE_PATH: "/live"
      LIVE_SERVER_SECRET_KEY: "secret-key"
      REDIS_HOST: "plane-redis"
      REDIS_PORT: "6379"
      REDIS_URL: "redis://plane-redis:6379/"
      NODE_OPTIONS: "--max-old-space-size=128"
    ports:
      - "3100:3000"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 192M

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c effective_cache_size=256MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=8MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 384M

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    command: valkey-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 160M

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 192M

  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 256M

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
